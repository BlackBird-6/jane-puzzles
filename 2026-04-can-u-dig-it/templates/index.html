<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LetterGrid Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>LetterGrid</h1>
    </header>

    <div class="container">
        <div class="main-panel">
            <div class="controls">
                <input type="text" id="searchInput" placeholder="Type a word..." autocomplete="off">
                <input type="color" id="colorPicker" value="#ef4444" list="presetColors">
                <datalist id="presetColors">
                    <option>#ef4444</option>
                    <option>#f97316</option>
                    <option>#f59e0b</option>
                    <option>#eab308</option>
                    <option>#84cc16</option>
                    <option>#22c55e</option>
                    <option>#10b981</option>
                    <option>#14b8a6</option>
                    <option>#06b6d4</option>
                    <option>#0ea5e9</option>
                    <option>#3b82f6</option>
                    <option>#6366f1</option>
                    <option>#8b5cf6</option>
                    <option>#a855f7</option>
                    <option>#d946ef</option>
                    <option>#ec4899</option>
                    <option>#f43f5e</option>
                    <option>#dc2626</option>
                    <option>#c026d3</option>
                    <option>#7c3aed</option>
                    <option>#2563eb</option>
                    <option>#059669</option>
                    <option>#65a30d</option>
                    <option>#ea580c</option>
                </datalist>
                <button class="btn-save" id="btnSave">Save</button>
            </div>

            <div class="grid-container" id="gridContainer">
                <div class="letter-grid" id="letterGrid">
                    {% for r in range(14) %}
                    {% for c in range(14) %}
                    <div class="tile" data-r="{{ r }}" data-c="{{ c }}">{{ grid[r][c] }}</div>
                    {% endfor %}
                    {% endfor %}
                </div>
                <svg class="svg-overlay" id="svgOverlay"></svg>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-section">
                <h2>Equivalences</h2>
                <input type="text" id="equivInput" placeholder="e.g. B=D=P, A=E" class="equiv-input" autocomplete="off"
                    title="Map letters that can be substituted for each other">
            </div>
            <div class="sidebar-section">
                <h2>Settings</h2>
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; margin-bottom: 0.5rem;">
                    <input type="checkbox" id="reuseToggle" style="width: 1.2rem; height: 1.2rem; cursor: pointer;">
                    <span style="font-size: 1.1rem; color: #cbd5e1;">Allow Letter Reuse</span>
                </label>
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; margin-bottom: 0.5rem;">
                    <input type="checkbox" id="straightToggle" style="width: 1.2rem; height: 1.2rem; cursor: pointer;">
                    <span style="font-size: 1.1rem; color: #cbd5e1;">Straight Lines Only</span>
                </label>
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; margin-bottom: 0.5rem;">
                    <input type="checkbox" id="showLinesToggle" checked
                        style="width: 1.2rem; height: 1.2rem; cursor: pointer;">
                    <span style="font-size: 1.1rem; color: #cbd5e1;">Show Path Lines</span>
                </label>
                <button id="btnRecompute" class="btn-secondary" style="width: 100%;">Recompute Word Search</button>
                <div id="recomputeStatus"
                    style="font-size: 0.5rem; color: #38bdf8; margin-top: 0.5rem; text-align: center; display: none;">
                    Computing... Please wait</div>
            </div>
            <div class="sidebar-section" id="selectedTileSection" style="display: none;">
                <h2 id="selectedTileHeader">Words on Tile</h2>
                <ul class="saved-queries" id="selectedTileWords" style="max-height: 250px; overflow-y: auto;">
                    <!-- Items inserted via JS -->
                </ul>
            </div>

            <h2>Saved Words</h2>
            <ul class="saved-queries" id="savedQueriesList">
                <!-- Items inserted via JS -->
            </ul>
            <div class="sidebar-footer" style="display: flex; flex-direction: column; gap: 0.5rem;">
                <div style="display: flex; gap: 0.5rem;">
                    <button id="btnExport" class="btn-secondary" style="flex: 1;">Export</button>
                    <button id="btnImport" class="btn-secondary" style="flex: 1;">Import</button>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                    <button onclick="loadState('empty')" class="btn-secondary"
                        style="font-size: 0.5rem; padding: 0.4rem;">Clear All</button>
                    <button onclick="loadState('state1')" class="btn-secondary"
                        style="font-size: 0.5rem; padding: 0.4rem;">State 1</button>
                    <button onclick="loadState('state2')" class="btn-secondary"
                        style="font-size: 0.5rem; padding: 0.4rem;">State 2</button>
                    <button onclick="loadState('state3')" class="btn-secondary"
                        style="font-size: 0.5rem; padding: 0.4rem;">State 3</button>
                </div>
            </div>
        </div>
    </div>

    <div class="all-words-panel">
        <h2>All Found Words <span id="allWordsCount"
                style="font-size: 1.1.2rem; color: #94a3b8; font-weight: normal;"></span></h2>
        <div class="all-words-list" id="allWordsList">
            <!-- filled by JS -->
        </div>
    </div>

    <script>
        const gridData = {{ grid | tojson }};
        const rows = 14;
        const cols = 14;
        let allWords = {{ all_words | tojson | safe }};
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
